name: Source candidate

# Candidate assembly only. Publication uses the reviewed, signed ASF originals
# after both PPMC endorsement and IPMC approval; see RELEASING.md.
on:
  push:
    tags:
      - 'v*-rc*'

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'apache/casbin-govaluate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assemble source candidate
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc[1-9][0-9]*$ ]]; then
            echo '::error::Expected vX.Y.Z-rcN.'
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%-rc*}"
          MODULE="$(awk '/^module /{print $2; exit}' go.mod)"
          if [[ "$MODULE" != 'github.com/casbin/govaluate' || "$MAJOR" -gt 1 ]]; then
            echo '::error::Tag does not match the v0/v1 module github.com/casbin/govaluate.'
            exit 1
          fi
          for file in LICENSE NOTICE DISCLAIMER; do
            test -s "$file"
          done
          NAME="apache-casbin-govaluate-${VERSION}-incubating-src"
          OUT="$RUNNER_TEMP/source-candidate"
          mkdir -p "$OUT"
          git archive --format=tar.gz --prefix="$NAME/" -o "$OUT/$NAME.tar.gz" HEAD
          (cd "$OUT" && sha512sum "$NAME.tar.gz" > "$NAME.tar.gz.sha512")
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: source-candidate-${{ github.ref_name }}
          path: ${{ steps.package.outputs.path }}/*
          if-no-files-found: error
